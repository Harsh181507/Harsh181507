<g><animate attributeName="opacity" dur="26.0s" repeatCount="indefinite" calcMode="discrete" keyTimes="0;0.0308;0.9538" values="0;1;0"/><text x="34" y="92" class="ps">$ </text><text x="64.6" y="92" class="cmd" clip-path="url(#t0)">whoami</text></g><text x="34" y="119" class="out" fill="#E6EDF7">Kumar Harsh Raj — CS undergrad @ VIT-AP · CGPA 8.11 · class of 2027<animate attributeName="opacity" dur="26.0s" repeatCount="indefinite" calcMode="discrete" keyTimes="0;0.0604;0.9538" values="0;1;0"/></text><g><animate attributeName="opacity" dur="26.0s" repeatCount="indefinite" calcMode="discrete" keyTimes="0;0.0712;0.9538" values="0;1;0"/><text x="34" y="146" class="ps">$ </text><text x="64.6" y="146" class="cmd" clip-path="url(#t2)">cat experience.log</text></g><text x="34" y="173" class="out" fill="#22D3EE">[Jun 2025 – Jan 2026]  SDE Intern @ Fin Tradify, Noida<animate attributeName="opacity" dur="26.0s" repeatCount="indefinite" calcMode="discrete" keyTimes="0;0.1331;0.9538" values="0;1;0"/></text><text x="34" y="200" class="out" fill="#94A3B8">  ▸ 2 production Android apps and reusable libraries on Google Play<animate attributeName="opacity" dur="26.0s" repeatCount="indefinite" calcMode="discrete" keyTimes="0;0.1438;0.9538" values="0;1;0"/></text><text x="34" y="227" class="out" fill="#94A3B8">  ▸ 12 Compose screens · 18 REST APIs · ~18% faster responses<animate attributeName="opacity" dur="26.0s" repeatCount="indefinite" calcMode="discrete" keyTimes="0;0.1546;0.9538" values="0;1;0"/></text><text x="34" y="254" class="out" fill="#94A3B8">  ▸ ~15% fewer crashes with Crashlytics, Sentry and LeakCanary<animate attributeName="opacity" dur="26.0s" repeatCount="indefinite" calcMode="discrete" keyTimes="0;0.1654;0.9538" values="0;1;0"/></text><g><animate attributeName="opacity" dur="26.0s" repeatCount="indefinite" calcMode="discrete" keyTimes="0;0.1762;0.9538" values="0;1;0"/><text x="34" y="281" class="ps">$ </text><text x="64.6" y="281" class="cmd" clip-path="url(#t7)">ls achievements/</text></g><text x="34" y="308" class="out" fill="#22D3EE">★ Lead — CSI Development Team, VIT-AP<animate attributeName="opacity" dur="26.0s" repeatCount="indefinite" calcMode="discrete" keyTimes="0;0.2327;0.9538" values="0;1;0"/></text><g><animate attributeName="opacity" dur="26.0s" repeatCount="indefinite" calcMode="discrete" keyTimes="0;0.2435;0.9538" values="0;1;0"/><text x="34" y="335" class="ps">$ </text><text x="64.6" y="335" class="cmd" clip-path="url(#t9)">echo $CURRENTLY</text></g><text x="34" y="362" class="out" fill="#34D399">Shipping CSI Events, the event app CSI VIT-AP runs its hackathons on<animate attributeName="opacity" dur="26.0s" repeatCount="indefinite" calcMode="discrete" keyTimes="0;0.2973;0.9538" values="0;1;0"/></text><g><animate attributeName="opacity" dur="26.0s" repeatCount="indefinite" calcMode="discrete" keyTimes="0;0.3081;0.9538" values="0;1;0"/><text x="34" y="389" class="ps">$ </text><rect x="64.6" y="374" width="10" height="19" fill="#22D3EE" class="blink"/></g>
