name: Contribution snake

# Redraws assets/snake on the "output" branch: daily, on demand, and on every push to main.
on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/snake-dark.svg?palette=github-dark&color_snake=#E3B04B&color_dots=#161b22,#3a3424,#6b5526,#a8822f,#E3B04B
            dist/snake-light.svg?color_snake=#8A5D0C&color_dots=#ebedf0,#f1e6ce,#e0c88f,#c09235,#8A5D0C

      - uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
