name: Contribution snake

# Redraws assets/snake on the "output" branch: daily, on demand, and on every push to main.
on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/snake-dark.svg?palette=github-dark&color_snake=#22D3EE&color_dots=#161b22,#1e3a5f,#2b5c8a,#4f7fd9,#818CF8
            dist/snake-light.svg?color_snake=#0891B2&color_dots=#ebedf0,#c7d2fe,#a5b4fc,#818cf8,#4f46e5

      - uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
