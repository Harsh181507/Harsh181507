name: Contribution snake

# Redraws assets/snake on the "output" branch: daily, on demand, and on every push to main.
on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/snake-dark.svg?palette=github-dark&color_snake=#ECEAE4&color_dots=#1A1D23,#3B2620,#6E3424,#B8492B,#FF6B45
            dist/snake-light.svg?palette=github-light&color_snake=#16161A&color_dots=#EEECE6,#FFD8CB,#FDA98E,#F07651,#E5502E

      - uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
